---
name: "CLA"
on:  # yamllint disable-line rule:truthy
  issue_comment:
    types:
      - "created"
  pull_request_target:
    types:
      - "opened"
      - "closed"
      - "synchronize"
  merge_group:
    types:
      - "checks_requested"
permissions:
  actions: "write"
  contents: "read" # CLA signatures are stored in https://github.com/authzed/cla
  pull-requests: "write"
  statuses: "write"
jobs:
  cla:
    name: "Check Signature"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "authzed/actions/cla-check@aedc8846d095f58073b21019cb11de97fea87437" # main
        with:
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          cla_assistant_token: "${{ secrets.CLA_ASSISTANT_ACCESS_TOKEN }}"
